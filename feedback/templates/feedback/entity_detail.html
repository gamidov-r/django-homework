{% extends 'feedback/base.html' %}
{% load fb_tags %}
{% block content %}
      <div class="album py-5 bg-body-tertiary">
        <div class="container">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
              <div class="card shadow-sm">
                <img src="{{ object.preview | media_filter}}">
                <div class="card-body">
                  <p class="card-text">Заголовок: {{ object.title }}</p>
                  <p class="card-text">Содержание: {{ object.body }}</p>
                  <p class="card-text">Дата: {{ object.created_at }}</p>
                  <p class="card-text">Просмотры: {{ object.view_counter }}</p>
                  <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group">
                      <a class="btn btn-primary" href="{% url 'feedback:entity_list' %}" role="button">К публикациям</a></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
   </div>
{% endblock %}
