{% extends 'feedback/base.html' %}
{% load fb_tags %}
{% block content %}
      <div class="album py-5 bg-body-tertiary">
        <div class="container">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
          {% for feedback in object_list %}
            <div class="col">
              <div class="card shadow-sm">
                <img src="{{ feedback.preview | media_filter}}">
                <div class="card-body">
                  <p class="card-text">
                    {{ feedback.title }}
                  </p>
                  <div
                    class="d-flex justify-content-between align-items-center"
                  >
                    <div class="btn-group">
                      <a class="btn btn-primary" href="{% url 'feedback:entity_detail' feedback.pk %}" role="button">Открыть</a>
                      <a class="btn btn-primary" href="{% url 'feedback:entity_update' feedback.pk %}" role="button">Редактировать</a>
                      <a class="btn btn-primary" href="{% url 'feedback:entity_delete' feedback.pk %}" role="button">Удалить</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
{% endblock %}
